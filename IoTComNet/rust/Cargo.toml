[workspace]
resolver = "2"
members = [
    "crates/iotcom-core",
    "crates/iotcom-ffi-support",
    "crates/iotcom-modbus",
    "crates/native/iotcom-modbus-native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Gravicode Studios (led by Kang Fadhil)"]
rust-version = "1.80"
publish = false

[workspace.dependencies]
iotcom-core = { path = "crates/iotcom-core" }
iotcom-ffi-support = { path = "crates/iotcom-ffi-support" }
iotcom-modbus = { path = "crates/iotcom-modbus" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"   # required: ffi_guard converts panics into status codes
strip = "symbols"
