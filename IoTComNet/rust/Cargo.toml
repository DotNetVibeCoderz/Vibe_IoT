[workspace]
resolver = "2"
# iotcom-zenoh-native is kept on disk but out of the workspace and every build: zenoh 1.10.1 compiles in lz4_flex 0.10,
# which has RUSTSEC-2026-0041 with no semver-compatible fix. Re-add it to `members` once zenoh moves to a fixed lz4_flex.
exclude = ["fuzz", "crates/native/iotcom-zenoh-native"]
members = [
    "crates/iotcom-core",
    "crates/iotcom-ffi-support",
    "crates/iotcom-modbus",
    "crates/iotcom-isotp",
    "crates/iotcom-coap",
    "crates/iotcom-mavlink",
    "crates/iotcom-lorawan",
    "crates/iotcom-dlms",
    "crates/iotcom-mbus",
    "crates/iotcom-canopen",
    "crates/iotcom-j1939",
    "crates/iotcom-iec104",
    "crates/iotcom-ntp",
    "crates/native/iotcom-modbus-native",
    "crates/native/iotcom-isotp-native",
    "crates/native/iotcom-ble-native",
    "crates/native/iotcom-usb-native",
    "tools/iotcom-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Gravicode Studios (led by Kang Fadhil)"]
rust-version = "1.80"
publish = false

[workspace.dependencies]
iotcom-core = { path = "crates/iotcom-core" }
iotcom-ffi-support = { path = "crates/iotcom-ffi-support" }
iotcom-modbus = { path = "crates/iotcom-modbus" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"   # required: ffi_guard converts panics into status codes
strip = "symbols"
