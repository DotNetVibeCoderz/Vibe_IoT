[package]
name = "iotcom-ble-native"
description = "C ABI over btleplug (BLE central), consumed by the IoTCom.Net.Transport.Ble NuGet package."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "iotcom_ble"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
iotcom-ffi-support.workspace = true
btleplug = "=0.13.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"

[lints]
workspace = true

# BlueZ is reached over D-Bus; vendoring libdbus lets the cross builds (zigbuild, musl) link without target sysroots.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }
