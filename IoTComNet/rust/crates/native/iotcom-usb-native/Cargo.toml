[package]
name = "iotcom-usb-native"
description = "C ABI over nusb (USB control/bulk/interrupt) and hidapi (HID), consumed by the IoTCom.Net.Transport.Usb NuGet package."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "iotcom_usb"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
iotcom-ffi-support.workspace = true
nusb = "=0.2.7"
futures-lite = "2"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "=2.6.6", default-features = false, features = ["macos-shared-device"] }

[lints]
workspace = true
