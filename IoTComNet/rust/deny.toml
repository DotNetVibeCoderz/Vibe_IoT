# cargo-deny policy (CI: `cargo deny check`). No GPL/AGPL in core crates.
[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
# cbindgen (MPL-2.0) is used only by tools/iotcom-bindgen, an unpublished generator that runs at development time;
# it is never linked into a shipped native library.
exceptions = [{ name = "cbindgen", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
