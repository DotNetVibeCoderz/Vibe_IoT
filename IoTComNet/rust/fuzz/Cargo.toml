# cargo-fuzz targets (nightly, libFuzzer). Kept out of the workspace so stable builds are unaffected.
#   cargo +nightly fuzz run modbus_decode -- -max_total_time=60
[package]
name = "iotcom-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
iotcom-core = { path = "../crates/iotcom-core" }
iotcom-modbus = { path = "../crates/iotcom-modbus" }
iotcom-isotp = { path = "../crates/iotcom-isotp" }
iotcom-coap = { path = "../crates/iotcom-coap" }
iotcom-mavlink = { path = "../crates/iotcom-mavlink" }
iotcom-lorawan = { path = "../crates/iotcom-lorawan" }
iotcom-dlms = { path = "../crates/iotcom-dlms" }
iotcom-mbus = { path = "../crates/iotcom-mbus" }

[workspace]
members = ["."]

[[bin]]
name = "modbus_decode"
path = "fuzz_targets/modbus_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modbus_master"
path = "fuzz_targets/modbus_master.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modbus_pdu"
path = "fuzz_targets/modbus_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "isotp"
path = "fuzz_targets/isotp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "coap"
path = "fuzz_targets/coap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mavlink"
path = "fuzz_targets/mavlink.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lorawan"
path = "fuzz_targets/lorawan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dlms"
path = "fuzz_targets/dlms.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mbus"
path = "fuzz_targets/mbus.rs"
test = false
doc = false
bench = false
