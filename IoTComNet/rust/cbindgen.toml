# C header for the iotcom_modbus native library.
#   cargo install cbindgen
#   cbindgen --config cbindgen.toml --crate iotcom-modbus-native --output include/iotcom_modbus.h
language = "C"
header = "/* IoTCom.Net native ABI — generated by cbindgen. Built by Gravicode Studios, led by Kang Fadhil. */"
include_guard = "IOTCOM_MODBUS_H"
cpp_compat = true
documentation = true
style = "both"

[export]
include = ["ModbusMasterCfg", "ModbusEvent"]

[parse]
parse_deps = true
include = ["iotcom-ffi-support", "iotcom-modbus"]
