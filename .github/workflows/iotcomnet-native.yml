name: IoTCom.Net native libraries

# Builds iotcom_modbus, iotcom_isotp, iotcom_ble and iotcom_usb for every supported RID. The release workflow packs them into
# IoTCom.Net.Native.Modbus, IoTCom.Net.Protocols.IsoTp, IoTCom.Net.Transport.Ble and IoTCom.Net.Transport.Usb under runtimes/{rid}/native/.
# The BLE (btleplug, vendored libdbus) and USB (nusb, hidapi) libraries are best effort: a RID where one fails still ships the others.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["IoTComNet/rust/**"]

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,          os: windows-latest, target: x86_64-pc-windows-msvc,        tool: cargo }
          - { rid: win-arm64,        os: windows-latest, target: aarch64-pc-windows-msvc,       tool: cargo }
          - { rid: linux-x64,        os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,      tool: zigbuild }
          - { rid: linux-arm64,      os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,     tool: zigbuild }
          - { rid: linux-arm,        os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf, tool: zigbuild }
          - { rid: linux-musl-x64,   os: ubuntu-latest,  target: x86_64-unknown-linux-musl,     tool: zigbuild }
          - { rid: linux-musl-arm64, os: ubuntu-latest,  target: aarch64-unknown-linux-musl,    tool: zigbuild }
          - { rid: osx-x64,          os: macos-latest,   target: x86_64-apple-darwin,           tool: cargo }
          - { rid: osx-arm64,        os: macos-latest,   target: aarch64-apple-darwin,          tool: cargo }
    defaults:
      run:
        working-directory: IoTComNet/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: IoTComNet/rust
          key: ${{ matrix.target }}
      - name: Install zig + cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build (glibc 2.17 baseline)
        if: matrix.tool == 'zigbuild' && !contains(matrix.target, 'musl')
        run: cargo zigbuild --release -p iotcom-modbus-native -p iotcom-isotp-native --target ${{ matrix.target }}.2.17
      - name: Build (musl)
        if: matrix.tool == 'zigbuild' && contains(matrix.target, 'musl')
        # musl defaults to +crt-static, which disables cdylib output; link the C runtime dynamically instead.
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo zigbuild --release -p iotcom-modbus-native -p iotcom-isotp-native --target ${{ matrix.target }}
      - name: Build
        if: matrix.tool == 'cargo'
        run: cargo build --release -p iotcom-modbus-native -p iotcom-isotp-native --target ${{ matrix.target }}
      - name: Build BLE (zigbuild)
        if: matrix.tool == 'zigbuild'
        continue-on-error: true
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}
        run: cargo zigbuild --release -p iotcom-ble-native --target ${{ matrix.target }}${{ !contains(matrix.target, 'musl') && '.2.17' || '' }}
      - name: Build USB (zigbuild)
        if: matrix.tool == 'zigbuild'
        continue-on-error: true
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}
        run: cargo zigbuild --release -p iotcom-usb-native --target ${{ matrix.target }}${{ !contains(matrix.target, 'musl') && '.2.17' || '' }}
      - name: Build BLE
        if: matrix.tool == 'cargo'
        continue-on-error: true
        run: cargo build --release -p iotcom-ble-native --target ${{ matrix.target }}
      - name: Build USB
        if: matrix.tool == 'cargo'
        continue-on-error: true
        run: cargo build --release -p iotcom-usb-native --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p ../artifacts/native/${{ matrix.rid }}
          cp target/${{ matrix.target }}/release/*iotcom_{modbus,isotp,ble,usb}.{dll,so,dylib} ../artifacts/native/${{ matrix.rid }}/ 2>/dev/null || true
          ls -la ../artifacts/native/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: IoTComNet/artifacts/native/${{ matrix.rid }}
          if-no-files-found: error
