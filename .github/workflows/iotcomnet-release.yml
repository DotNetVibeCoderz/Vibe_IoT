name: IoTCom.Net release

# Tag iotcomnet-vX.Y.Z[-suffix] (prefixed: this repository hosts several projects) →
#   1. build natives for every RID,
#   2. sign them (Windows Authenticode, macOS Developer ID + notarisation) when the signing secrets exist,
#   3. pack all NuGet packages (SourceLink, symbols), author-sign them when a certificate exists, push to nuget.org (NUGET_API_KEY),
#   4. publish the CLI and the Gallery as portable, signed archives and attach them to a GitHub release.
#
# Signing is optional: without the secrets every signing step is skipped and the release still ships unsigned.
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD      Authenticode code-signing certificate (also used to sign NuGet packages)
#   APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                                                           Developer ID Application certificate and notarytool credentials
on:
  push:
    tags: ["iotcomnet-v*"]

permissions:
  contents: write

env:
  TIMESTAMPER: http://timestamp.digicert.com

jobs:
  native:
    uses: ./.github/workflows/iotcomnet-native.yml

  sign-native:
    needs: native
    runs-on: macos-latest
    env:
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
      - name: Authenticode-sign Windows libraries
        if: env.WINDOWS_SIGN_PFX_BASE64 != ''
        run: |
          brew install osslsigncode
          echo "$WINDOWS_SIGN_PFX_BASE64" | base64 --decode > sign.pfx
          for f in natives/native-win-*/*.dll; do
            osslsigncode sign -pkcs12 sign.pfx -pass "$WINDOWS_SIGN_PFX_PASSWORD" -h sha256 -n "IoTCom.Net" \
              -i https://github.com/${{ github.repository }} -t "$TIMESTAMPER" -in "$f" -out "$f.signed"
            mv "$f.signed" "$f"
            osslsigncode verify -in "$f" | grep -q "Signature verification: ok" || echo "::warning::$f was signed but does not verify against the local trust store"
          done
          rm -f sign.pfx
      - name: Import the Developer ID certificate
        if: env.APPLE_DEVELOPER_ID_P12_BASE64 != ''
        run: bash IoTComNet/build/macos/import-certificate.sh
      - name: Codesign and notarise macOS libraries
        if: env.APPLE_DEVELOPER_ID_P12_BASE64 != ''
        run: |
          for f in natives/native-osx-*/*.dylib; do bash IoTComNet/build/macos/codesign.sh "$f"; done
          ditto -c -k --keepParent natives notarise.zip
          bash IoTComNet/build/macos/notarise.sh notarise.zip
      - name: Re-upload
        uses: actions/upload-artifact@v4
        with:
          name: signed-natives
          path: natives

  pack:
    needs: sign-native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IoTComNet
    env:
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: signed-natives
          path: IoTComNet/artifacts/native-download
      - name: Arrange runtimes
        run: |
          for d in artifacts/native-download/native-*; do
            rid="${d##*/native-}"
            mkdir -p "artifacts/native/$rid" && cp "$d"/* "artifacts/native/$rid/"
          done
          ls -R artifacts/native
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#iotcomnet-v}" >> "$GITHUB_ENV"
      - run: dotnet test tests/IoTCom.Net.Tests -c Release
      - run: dotnet pack IoTCom.Net.slnx -c Release -p:IoTComVersion=$VERSION -p:CI=true -o artifacts/packages
      - name: Author-sign the packages
        if: env.WINDOWS_SIGN_PFX_BASE64 != ''
        run: |
          echo "$WINDOWS_SIGN_PFX_BASE64" | base64 --decode > sign.pfx
          dotnet nuget sign "artifacts/packages/*.nupkg" --certificate-path sign.pfx --certificate-password "$WINDOWS_SIGN_PFX_PASSWORD" --timestamper "$TIMESTAMPER" --overwrite
          rm -f sign.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: IoTComNet/artifacts/packages
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  apps:
    name: apps (${{ matrix.rid }})
    needs: sign-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: ubuntu-latest, archive: zip }
          - { rid: linux-x64, os: ubuntu-latest, archive: tar.gz }
          - { rid: osx-arm64, os: macos-latest,  archive: zip }
    defaults:
      run:
        working-directory: IoTComNet
    env:
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: signed-natives
          path: IoTComNet/artifacts/native-download
      - name: Arrange runtimes
        shell: bash
        run: |
          for d in artifacts/native-download/native-*; do
            rid="${d##*/native-}"
            mkdir -p "artifacts/native/$rid" && cp "$d"/* "artifacts/native/$rid/"
          done
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#iotcomnet-v}" >> "$GITHUB_ENV"
      - name: Publish the CLI and the Gallery (self-contained, single file)
        shell: bash
        run: |
          for p in tools/iotcom-cli gallery/IoTCom.Net.Gallery; do
            dotnet publish "$p" -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:GenerateDocumentationFile=false \n              -p:IoTComVersion=$VERSION -o "out/iotcom-net-$VERSION-${{ matrix.rid }}"
          done
          cp LICENSE NOTICE "out/iotcom-net-$VERSION-${{ matrix.rid }}/"
          ls -la out/iotcom-net-$VERSION-${{ matrix.rid }}
      - name: Authenticode-sign the executables
        if: matrix.rid == 'win-x64' && env.WINDOWS_SIGN_PFX_BASE64 != ''
        run: |
          sudo apt-get install -y -qq osslsigncode > /dev/null
          echo "$WINDOWS_SIGN_PFX_BASE64" | base64 --decode > sign.pfx
          for f in out/*/*.exe; do
            osslsigncode sign -pkcs12 sign.pfx -pass "$WINDOWS_SIGN_PFX_PASSWORD" -h sha256 -n "IoTCom.Net" \
              -i https://github.com/${{ github.repository }} -t "$TIMESTAMPER" -in "$f" -out "$f.signed"
            mv "$f.signed" "$f"
          done
          rm -f sign.pfx
      - name: Import the Developer ID certificate
        if: matrix.rid == 'osx-arm64' && env.APPLE_DEVELOPER_ID_P12_BASE64 != ''
        run: bash build/macos/import-certificate.sh
      - name: Codesign the executables (hardened runtime)
        if: matrix.rid == 'osx-arm64' && env.APPLE_DEVELOPER_ID_P12_BASE64 != ''
        run: |
          for f in out/*/*; do
            if file "$f" | grep -q "Mach-O"; then bash build/macos/codesign.sh "$f" build/macos/entitlements.plist; fi
          done
      - name: Archive
        shell: bash
        run: |
          cd out
          name="iotcom-net-$VERSION-${{ matrix.rid }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v ditto > /dev/null; then ditto -c -k --keepParent "$name" "$name.zip"; else zip -qr "$name.zip" "$name"; fi
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - name: Notarise
        if: matrix.rid == 'osx-arm64' && env.APPLE_DEVELOPER_ID_P12_BASE64 != ''
        run: bash build/macos/notarise.sh "out/iotcom-net-$VERSION-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: IoTComNet/out/iotcom-net-*.${{ matrix.archive }}

  github-release:
    needs: [pack, apps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: assets
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#iotcomnet-v}"
          awk -v v="## $version" 'index($0, v) == 1 { on = 1; next } /^## / && on { exit } on' IoTComNet/CHANGELOG.md > notes.md
          printf '\n\nPackages: https://www.nuget.org/packages?q=IoTCom.Net — portable CLI and Gallery builds are attached.\n' >> notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#iotcomnet-v}"
          pre=""; case "$version" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" assets/* --title "IoTCom.Net $version" --notes-file notes.md $pre
