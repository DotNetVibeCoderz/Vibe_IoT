name: IoTCom.Net CI

on:
  push:
    branches: [main]
    paths: ["IoTComNet/**", ".github/workflows/iotcomnet-*.yml"]
  pull_request:
    paths: ["IoTComNet/**", ".github/workflows/iotcomnet-*.yml"]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: IoTComNet/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: IoTComNet/rust
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p iotcom-modbus-native -p iotcom-isotp-native
      - uses: actions/upload-artifact@v4
        with:
          name: native-host-${{ matrix.os }}
          path: |
            IoTComNet/rust/target/release/iotcom_modbus.dll
            IoTComNet/rust/target/release/libiotcom_modbus.so
            IoTComNet/rust/target/release/libiotcom_modbus.dylib
            IoTComNet/rust/target/release/iotcom_isotp.dll
            IoTComNet/rust/target/release/libiotcom_isotp.so
            IoTComNet/rust/target/release/libiotcom_isotp.dylib
          if-no-files-found: ignore

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IoTComNet
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: IoTComNet/rust/Cargo.toml
          command: check
          arguments: --all-features
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore IoTCom.Net.slnx
      - name: Vulnerable NuGet packages
        run: |
          dotnet list IoTCom.Net.slnx package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  dotnet:
    name: .NET (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: IoTComNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: native-host-${{ matrix.os }}
          path: IoTComNet/native
      - name: Expose the native library to tests
        shell: bash
        run: echo "IOTCOM_NATIVE_PATH=$GITHUB_WORKSPACE/IoTComNet/native" >> "$GITHUB_ENV"
      - name: Virtual CAN interface (SocketCAN tests)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vcan && sudo ip link add vcan0 type vcan && sudo ip link set vcan0 up && ip link show vcan0
      - run: dotnet build IoTCom.Net.slnx -c Release
      - run: dotnet test tests/IoTCom.Net.Tests -c Release --no-build --logger trx --results-directory TestResults
      - name: Wireshark dissects our pcapng (interop gate)
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark > /dev/null
          IOTCOM_PCAP_OUT=$PWD/sample.pcapng dotnet test tests/IoTCom.Net.Tests -c Release --no-build --filter "FullyQualifiedName~Writes_a_valid_capture"
          tshark -r sample.pcapng -T fields -e frame.protocols | tee protocols.txt
          grep -q ':mbtcp' protocols.txt && grep -q ':coap' protocols.txt && grep -q 'can' protocols.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: IoTComNet/TestResults

  alpine:
    name: .NET (Alpine / musl)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    defaults:
      run:
        working-directory: IoTComNet
    steps:
      - uses: actions/checkout@v4
      - run: dotnet test tests/IoTCom.Net.Tests -c Release

  aot:
    name: NativeAOT smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IoTComNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish a sample with NativeAOT (trim/AOT analyzers must stay clean)
        run: dotnet publish samples/console/ModbusMaster -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true
      - run: timeout 5 samples/console/ModbusMaster/bin/Release/net10.0/linux-x64/publish/ModbusMaster --simulate || [ $? -eq 124 ]

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IoTComNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the CLI the extension drives over JSON-RPC
        run: dotnet build tools/iotcom-cli -c Release
      - name: Test against the real CLI and package the .vsix
        working-directory: IoTComNet/tools/vscode-iotcom
        run: |
          npm ci
          npm test
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: iotcom-net-tools-vsix
          path: IoTComNet/tools/vscode-iotcom/iotcom-net-tools.vsix

  docs:
    name: Docs & notebooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IoTComNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Native libraries for the notebooks (ISO-TP)
        run: cd rust && cargo build --release -p iotcom-isotp-native -p iotcom-modbus-native
      - name: EN/ID parity and links
        run: python build/check_docs_parity.py
      - name: Generated files are up to date
        run: |
          python conformance/generate.py
          python build/generate_notebooks.py
          git diff --exit-code -- conformance notebooks
      - name: Run every notebook
        run: python build/check_notebooks.py
